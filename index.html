<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0F3F4F">
<title>PointPal</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192-v2.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0F3F4F;
    --navy-deep:#0A2C38;
    --teal:#17A398;
    --teal-light:#5FCBBF;
    --coral:#FF6B4A;
    --coral-deep:#E85434;
    --gold:#FFB627;
    --gold-deep:#E89E10;
    --sand:#FFF4E3;
    --bg:#EAF6FB;
    --card:#FFFFFF;
    --ink:#0B2530;
    --ink-soft:#4C6773;
    --success:#34C759;
    --danger:#FF4757;
    --radius-lg:28px;
    --radius-md:18px;
    --radius-sm:12px;
    --shadow:0 8px 24px rgba(11,37,48,0.12);
    --shadow-sm:0 4px 12px rgba(11,37,48,0.08);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito', sans-serif;
    background: var(--bg);
    color: var(--ink);
    overscroll-behavior:none;
    -webkit-touch-callout:none;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', sans-serif;}
  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    position:relative;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }

  /* ---------- HEADER / TANK ---------- */
  .header{
    background: linear-gradient(180deg,
      #130C33 0%,
      #221D5C 22%,
      #3D4E97 48%,
      #8C9EDB 72%,
      rgba(140,158,219,0.25) 88%,
      rgba(140,158,219,0) 100%
    );
    padding: calc(18px + env(safe-area-inset-top)) 20px 30px;
    border-radius: 0 0 32px 32px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .header::before{
    content:'';
    position:absolute; inset:0; z-index:0; pointer-events:none;
    opacity:.85;
    background-image:
      radial-gradient(circle 1.3px at 8% 10%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.7px at 22% 20%, #FFC94A 99%, transparent 100%),
      radial-gradient(circle 1.3px at 34% 6%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.5px at 48% 16%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.6px at 60% 8%, #FFC94A 99%, transparent 100%),
      radial-gradient(circle 1.3px at 70% 22%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.7px at 80% 12%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.3px at 90% 18%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.6px at 96% 6%, #FFC94A 99%, transparent 100%),
      radial-gradient(circle 1.3px at 14% 26%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.3px at 42% 28%, #fff 99%, transparent 100%),
      radial-gradient(circle 1.5px at 55% 30%, #FFC94A 99%, transparent 100%);
  }
  .header-top{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:14px;
    position:relative; z-index:1;
  }
  .greeting{font-size:22px; font-weight:800; font-family:'Baloo 2';}
  .greeting-sub{font-size:13px; opacity:.75; font-weight:700; margin-top:2px;}
  .lock-btn{
    width:44px; height:44px; border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:none; color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .meters{display:flex; gap:12px; position:relative; z-index:1;}
  .meter-card{
    flex:1;
    background:rgba(255,255,255,0.08);
    border-radius: var(--radius-md);
    padding:14px 16px;
    position:relative;
    overflow:hidden;
    min-height:124px;
    box-shadow: var(--shadow);
  }
  .meter-label{font-size:12.5px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; opacity:.85; position:relative; z-index:2; display:flex; align-items:center; gap:4px;}
  .point-core-icon{width:34px; height:34px; object-fit:contain;}
  .meter-value{font-size:38px; font-weight:800; font-family:'Baloo 2'; margin-top:4px; position:relative; z-index:2; display:flex; align-items:baseline; gap:5px;}
  .meter-value small{font-size:16px; font-weight:700; opacity:.85;}
  #pointsMeter{background: linear-gradient(160deg, #6b4a12 0%, #3d2a0c 100%);}
  #pointsMeter .meter-label, #pointsMeter .meter-value{justify-content:flex-end; text-align:right;}
  #pointsMeter .meter-value{align-items:center; gap:8px;}
  .points-pip{position:absolute; left:8px; bottom:-14px; width:148px; height:auto; z-index:1; pointer-events:none;}
  #minutesMeter{background: linear-gradient(160deg, #362a7a 0%, #1e1650 100%);}
  #minutesMeter .meter-label, #minutesMeter .meter-value{justify-content:flex-end; text-align:right;}
  .minutes-pip{position:absolute; left:8px; bottom:-14px; width:148px; height:auto; z-index:1; pointer-events:none;}

  /* ---------- CONTENT ---------- */
  .content{padding:18px 16px 8px; flex:1;}
  .section-title{
    font-size:15px; font-weight:800; color:var(--ink); margin:18px 4px 10px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .section-title .tag{
    font-size:11px; background:var(--sand); color:var(--gold-deep);
    padding:3px 10px; border-radius:20px; font-weight:800;
  }

  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}

  .chore-card{
    background:var(--card); border-radius:var(--radius-md);
    padding:16px 14px; box-shadow:var(--shadow-sm);
    display:flex; flex-direction:column; gap:8px;
    min-height:118px;
    border:2px solid transparent;
    position:relative; overflow:hidden;
    transition: transform 120ms ease, box-shadow 120ms ease, border-color 200ms ease;
  }
  .chore-card:active{transform:scale(.95);}
  .chore-card.done{border-color:var(--success); background:#F2FCF4;}
  .chore-card.pending{border-color:var(--gold); background:#FFFAF0;}
  .chore-card.blocked{opacity:.45; filter:grayscale(55%); pointer-events:none;}
  .chore-emoji{font-size:30px; line-height:1;}
  .chore-label{font-weight:800; font-size:15px; color:var(--ink);}
  .chore-points{font-size:13px; font-weight:800; color:var(--teal);}
  .chore-status{
    position:absolute; top:10px; right:10px; font-size:11px; font-weight:800;
    padding:3px 9px; border-radius:20px;
  }
  .chore-status.pending{background:var(--gold); color:#fff;}
  .chore-status.done{background:var(--success); color:#fff;}
  .chore-status.blocked{background:var(--danger); color:#fff;}
  .chore-count{
    position:absolute; bottom:10px; right:10px; font-size:12px; font-weight:800; color:var(--ink-soft);
    background:var(--bg); padding:2px 8px; border-radius:20px;
  }

  .challenge-list{display:flex; flex-direction:column; gap:10px;}
  .challenge-card{
    background: linear-gradient(135deg, #FFE9D6 0%, var(--sand) 100%);
    border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm);
    display:flex; align-items:center; gap:14px;
    border:2px solid transparent;
  }
  .challenge-card.done{border-color:var(--success);}
  .challenge-pip{width:54px; height:54px; object-fit:contain; flex-shrink:0;}
  .challenge-info{flex:1; min-width:0;}
  .challenge-title{font-weight:800; font-size:14.5px; color:var(--ink);}
  .challenge-progress{font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
  .challenge-days{font-size:11px; font-weight:800; color:var(--ink-soft); white-space:nowrap;}

  .punishment-list{display:flex; flex-direction:column; gap:10px;}
  .punishment-card{
    background: linear-gradient(135deg, #FFE3E3 0%, #FFEDED 100%);
    border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm);
    border:2px solid var(--danger);
    display:flex; align-items:center; gap:14px;
  }
  .punishment-pip{width:50px; height:50px; object-fit:contain; flex-shrink:0; opacity:.85;}
  .punishment-info{flex:1; min-width:0;}
  .punishment-label{font-weight:800; font-size:14.5px; color:var(--danger);}
  .punishment-meta{font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
  .punishment-notice{
    background:#FFEDED; color:var(--danger); font-weight:800; font-size:13px;
    padding:10px 14px; border-radius:var(--radius-md); margin-bottom:12px;
  }

  .goal-card{
    background: linear-gradient(135deg, #E3F7F4 0%, #C9EFE8 100%);
    border-radius:var(--radius-md); padding:14px 16px; box-shadow:var(--shadow-sm);
  }
  .goal-top{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
  .goal-pip{width:54px; height:54px; object-fit:contain; flex-shrink:0;}
  .goal-info{flex:1; min-width:0;}
  .goal-title{font-weight:800; font-size:14.5px; color:var(--ink);}
  .goal-sub{font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-top:2px;}
  .goal-track{height:10px; border-radius:6px; background:rgba(255,255,255,.6); overflow:hidden;}
  .goal-fill{height:100%; background:var(--teal); border-radius:6px; transition:width 300ms ease;}

  /* PRIZES */
  .prize-list{display:flex; flex-direction:column; gap:12px;}
  .prize-card{
    background:var(--card); border-radius:var(--radius-md); padding:16px;
    box-shadow:var(--shadow-sm); display:flex; align-items:center; gap:14px;
    border:2px solid transparent;
    transition: transform 120ms ease;
  }
  .prize-card:active{transform:scale(.97);}
  .prize-card.requested{border-color:var(--gold); background:#FFFAF0;}
  .prize-card.blocked{opacity:.5; filter:grayscale(55%);}
  .prize-emoji{font-size:32px; width:48px; text-align:center;}
  .prize-info{flex:1;}
  .prize-title{font-weight:800; font-size:15px;}
  .prize-cost{font-size:13px; color:var(--teal); font-weight:800; margin-top:2px;}
  .prize-btn{
    padding:10px 16px; border-radius:20px; border:none; font-weight:800; font-size:13px;
    background:var(--navy); color:#fff; white-space:nowrap;
  }
  .prize-btn:disabled{background:#D8E2E6; color:#93A5AC;}
  .prize-btn.requested{background:var(--gold);}
  .goal-toggle-btn{
    background:var(--bg); border:none; border-radius:50%; width:36px; height:36px;
    font-size:16px; flex-shrink:0; opacity:.4;
  }
  .goal-toggle-btn.active{opacity:1; background:#E3F7F4;}

  /* HISTORY */
  .history-item{
    background:var(--card); border-radius:var(--radius-sm); padding:13px 14px;
    display:flex; align-items:center; gap:12px; margin-bottom:9px; box-shadow:var(--shadow-sm);
  }
  .history-emoji{font-size:22px;}
  .history-info{flex:1;}
  .history-label{font-weight:800; font-size:14px;}
  .history-meta{font-size:11.5px; color:var(--ink-soft); font-weight:700; margin-top:1px;}
  .history-amount{font-weight:800; font-size:14px;}
  .history-amount.pos{color:var(--success);}
  .history-amount.neg{color:var(--coral-deep);}
  .history-amount.wait{color:var(--gold-deep);}
  .history-amount.deny{color:var(--danger); text-decoration:line-through; opacity:.7;}

  /* CALENDAR */
  .cal-nav{display:flex; align-items:center; justify-content:space-between; margin:4px 4px 14px;}
  .cal-nav-btn{
    width:36px; height:36px; border-radius:50%; border:none; background:var(--card);
    box-shadow:var(--shadow-sm); font-size:18px; font-weight:800; color:var(--navy);
    display:flex; align-items:center; justify-content:center;
  }
  .cal-nav-btn:active{transform:scale(.92);}
  .cal-nav-label{font-weight:800; font-size:15px; color:var(--ink); display:flex; align-items:center; gap:8px;}

  .week-list{display:flex; flex-direction:column; gap:10px;}
  .day-row{
    width:100%; background:var(--card); border-radius:var(--radius-md); padding:12px 14px;
    display:flex; align-items:center; gap:12px; box-shadow:var(--shadow-sm);
    border:2px solid transparent; text-align:left;
  }
  .day-row.today{border-color:var(--teal-light);}
  .day-row-date{width:40px; text-align:center; flex-shrink:0;}
  .day-row-dow{font-size:10.5px; font-weight:800; color:var(--ink-soft); text-transform:uppercase;}
  .day-row-num{font-size:18px; font-weight:800; font-family:'Baloo 2'; color:var(--ink);}
  .day-row.today .day-row-num{color:var(--teal);}
  .day-row-chips{flex:1; display:flex; flex-wrap:wrap; gap:6px;}
  .day-row-empty{color:var(--ink-soft); font-size:13px; font-weight:700;}
  .day-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:800;
    padding:4px 8px; border-radius:20px; background:var(--bg); color:var(--ink-soft);
  }
  .day-chip.chip-pos{background:#EAFBEF; color:var(--success);}
  .day-chip.chip-neg{background:#FFF0ED; color:var(--coral-deep);}
  .day-chip.chip-wait{background:#FFF8EA; color:var(--gold-deep);}
  .day-chip.chip-deny{background:#FFF0F1; color:var(--danger); opacity:.7; text-decoration:line-through;}

  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow-row{margin-bottom:6px;}
  .cal-dow{text-align:center; font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase;}
  .cal-cell{
    aspect-ratio:1; background:var(--card); border-radius:12px; border:2px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    box-shadow:var(--shadow-sm); padding:4px 2px;
  }
  .cal-cell.empty{background:transparent; box-shadow:none;}
  .cal-cell.today{border-color:var(--teal-light);}
  .cal-cell.has-activity{background:#F7FDFB;}
  .cal-cell-num{font-size:13px; font-weight:800; color:var(--ink);}
  .cal-cell.today .cal-cell-num{color:var(--teal);}
  .cal-cell-amt{font-size:10px; font-weight:800; line-height:1.25;}
  .cal-cell-amt.pos{color:var(--success);}
  .cal-cell-amt.neg{color:var(--coral-deep);}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state .e{font-size:40px; margin-bottom:8px;}

  /* NAV */
  .navbar{
    position:fixed; bottom:calc(8px + env(safe-area-inset-bottom)); left:16px; right:16px;
    max-width:528px; margin:0 auto;
    background:rgba(255,255,255,0.52); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    border:1px solid rgba(255,255,255,0.65);
    border-radius: 999px;
    display:flex; padding: 8px 10px;
    box-shadow: 0 10px 28px rgba(11,37,48,0.15);
  }
  .nav-btn{
    flex:1; background:none; border:none; display:flex; flex-direction:column;
    align-items:center; gap:3px; padding:6px 0; color:var(--ink-soft); font-weight:800; font-size:11px;
  }
  .nav-btn .ic{width:27px; height:27px; object-fit:contain;}
  .nav-btn.active{color:var(--teal);}

  /* MODAL / OVERLAY */
  .overlay{
    position:fixed; inset:0; background:rgba(10,30,38,0.55);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
    opacity:0; pointer-events:none; transition:opacity 200ms ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  #pinOverlay{z-index:1200;}
  .sheet{
    background:#fff; width:100%; max-width:560px; border-radius:26px 26px 0 0;
    max-height:88vh; overflow-y:auto; padding:22px 20px calc(26px + env(safe-area-inset-bottom));
    transform:translateY(30px); transition:transform 250ms cubic-bezier(.32,.72,0,1);
  }
  .overlay.show .sheet{transform:translateY(0);}
  .sheet-handle{width:40px; height:5px; background:#E2E8EA; border-radius:4px; margin:0 auto 16px;}
  .sheet-title{font-size:20px; font-weight:800; margin-bottom:4px;}
  .sheet-sub{font-size:13px; color:var(--ink-soft); font-weight:700; margin-bottom:18px;}

  .pip-notify-img{width:180px; height:auto; margin:4px auto 14px; display:block;}
  .pip-notify-title{font-family:'Baloo 2'; font-weight:800; font-size:21px; color:var(--navy); margin-bottom:8px;}
  .pip-notify-body{font-size:15px; font-weight:700; color:var(--ink-soft); line-height:1.4;}

  .pin-dots{display:flex; gap:14px; justify-content:center; margin:22px 0;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--teal); background:transparent;}
  .pin-dot.filled{background:var(--teal);}
  .pin-pad{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; max-width:280px; margin:0 auto;}
  .pin-key{
    background:var(--bg); border:none; border-radius:16px; font-size:22px; font-weight:800;
    padding:16px 0; color:var(--ink);
  }
  .pin-key:active{background:#DDEEF3;}
  .pin-key.wide{grid-column:span 1;}

  .btn{
    display:block; width:100%; text-align:center; padding:15px; border-radius:16px;
    border:none; font-weight:800; font-size:15px; margin-top:10px; cursor:pointer;
  }
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-approve{background:var(--success); color:#fff;}
  .btn-deny{background:#FFECEC; color:var(--danger);}
  .btn-ghost{background:var(--bg); color:var(--ink);}

  .approve-all-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:14px; padding-bottom:12px; border-bottom:1px solid #EEF3F4;
  }
  .approve-all-count{font-weight:800; font-size:13px; color:var(--ink-soft);}
  .btn-bulk-approve{
    background:var(--success); color:#fff; border:none; border-radius:20px;
    padding:9px 16px; font-weight:800; font-size:13px;
  }
  .btn-bulk-approve:active{transform:scale(.96);}

  .approval-item{
    background:var(--bg); border-radius:16px; padding:14px; margin-bottom:12px;
  }
  .approval-top{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 10px; margin-bottom:10px;}
  .approval-label{flex:1 1 auto; min-width:0; font-weight:800; font-size:15px;}
  .approval-amount{flex-shrink:0; white-space:nowrap; font-weight:800; font-size:15px;}
  .approval-meta{font-size:12px; color:var(--ink-soft); font-weight:700; margin-bottom:10px;}
  .approval-actions{display:flex; gap:0;}
  .approval-actions .btn{margin-top:0; flex:1; padding:11px; border-radius:0;}
  .approval-actions .btn-approve{border-radius:16px 0 0 16px; box-shadow:inset -1px 0 0 rgba(255,255,255,0.35);}
  .approval-actions .btn-deny{border-radius:0 16px 16px 0;}

  .settings-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 2px; border-bottom:1px solid #EEF3F4;
  }
  .settings-row:last-child{border-bottom:none;}
  .settings-label{font-weight:800; font-size:14.5px;}
  .settings-input{
    border:2px solid #E4ECEE; border-radius:10px; padding:8px 10px; width:70px; text-align:center;
    font-weight:800; font-family:'Nunito'; font-size:14px;
  }
  .tab-row{display:flex; gap:8px; margin-bottom:16px;}
  .tab-btn{
    flex:1; padding:10px; border-radius:14px; border:none; background:var(--bg); font-weight:800; font-size:13px; color:var(--ink-soft);
  }
  .tab-btn.active{background:var(--navy); color:#fff;}
  @media (max-width:699px){
    .tab-row-scroll{
      flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch;
      scrollbar-width:none; margin:0 -20px 16px; padding:0 20px 4px;
      -webkit-mask-image:linear-gradient(to right, #000 calc(100% - 24px), transparent);
              mask-image:linear-gradient(to right, #000 calc(100% - 24px), transparent);
    }
    .tab-row-scroll::-webkit-scrollbar{display:none;}
    .tab-row-scroll .tab-btn{flex:0 0 auto; white-space:nowrap; padding:10px 16px;}
  }

  .subtab-row{
    display:flex; gap:20px; flex-wrap:wrap;
    padding-top:2px; margin:-4px 4px 18px; border-bottom:1px solid #EEF3F4;
  }
  .subtab-btn{
    background:none; border:none; padding:8px 1px 9px;
    font-weight:800; font-size:13px; color:var(--ink-soft);
    border-bottom:3px solid transparent; margin-bottom:-1px;
  }
  .subtab-btn.active{color:var(--teal);border-bottom-color:var(--teal);}

  /* FLOATING FEEDBACK */
  .floaters{position:fixed; inset:0; pointer-events:none; z-index:200;}
  .floater{
    position:absolute; font-family:'Baloo 2'; font-weight:800; font-size:22px;
    color:var(--success); animation: floatUp 1100ms ease-out forwards;
    text-shadow:0 2px 6px rgba(0,0,0,0.12);
  }
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.6); opacity:0;}
    15%{transform:translateY(-10px) scale(1.15); opacity:1;}
    100%{transform:translateY(-90px) scale(1); opacity:0;}
  }
  .confetti{position:absolute; top:-10px; width:8px; height:14px; opacity:.95; animation: confettiFall 1400ms ease-in forwards;}
  @keyframes confettiFall{
    0%{transform:translateY(0) rotate(0deg); opacity:1;}
    100%{transform:translateY(340px) rotate(540deg); opacity:0;}
  }

  .toast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:12px 20px; border-radius:30px;
    font-weight:800; font-size:14px; z-index:300; opacity:0; transition:all 250ms ease;
    max-width:80%; text-align:center; box-shadow:var(--shadow); pointer-events:none;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  .undo-toast{
    position:fixed; right:16px; bottom:calc(90px + env(safe-area-inset-bottom));
    background:var(--navy); color:#fff; border-radius:16px; padding:12px 14px 15px;
    display:flex; align-items:center; gap:12px; box-shadow:var(--shadow);
    z-index:400; max-width:calc(100% - 32px);
    opacity:0; pointer-events:none; transform:translateY(10px);
    transition:opacity 200ms ease, transform 200ms ease;
  }
  .undo-toast.show{opacity:1; pointer-events:auto; transform:translateY(0);}
  .undo-toast-msg{font-weight:700; font-size:13.5px;}
  .undo-toast-btn{
    background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:12px;
    padding:8px 14px; font-weight:800; font-size:13px; white-space:nowrap; flex-shrink:0;
  }
  .undo-toast-btn:active{transform:scale(.95);}
  .undo-toast-bar-track{
    position:absolute; left:14px; right:14px; bottom:5px; height:3px;
    background:rgba(255,255,255,.18); border-radius:2px; overflow:hidden;
  }
  .undo-toast-bar-fill{height:100%; width:100%; background:rgba(255,255,255,.75);}

  .badge-count{
    position:absolute; top:-4px; right:-4px; background:var(--danger); color:#fff;
    font-size:11px; font-weight:800; border-radius:20px; padding:2px 6px; min-width:18px; text-align:center;
  }
  .lock-wrap{position:relative;}

  .child-switch-row{display:none; gap:8px; margin-bottom:14px; position:relative; z-index:1;}
  .child-pill{
    background:rgba(255,255,255,0.1); border:2px solid transparent; color:rgba(255,255,255,.8);
    border-radius:20px; padding:7px 16px; font-weight:800; font-size:13px;
  }
  .child-pill.active{background:#fff; color:var(--navy); border-color:#fff;}

  .child-tag{
    font-size:10.5px; font-weight:800; color:var(--teal); background:#EAFBF8;
    padding:2px 8px; border-radius:20px; vertical-align:middle; margin-left:4px;
  }

  .child-name-input{
    width:100%; padding:12px 14px; border-radius:12px; border:2px solid #E4ECEE;
    font-family:'Nunito'; font-weight:700; font-size:15px; margin-top:6px;
  }
  .icon-btn-sm{background:var(--bg); border:none; border-radius:10px; padding:8px 12px; font-weight:800; color:var(--coral-deep); font-size:13px; flex-shrink:0;}
  .icon-btn-sm:disabled{opacity:.4; pointer-events:none;}
  .add-row{display:flex; gap:8px; margin-top:14px;}
  .add-row input{flex:1;}
  .list-edit-item{padding:12px 0; border-bottom:1px solid #EEF3F4; background:#fff;}
  .list-edit-item:last-child{border-bottom:none;}
  .list-edit-item.dragging{box-shadow:0 8px 20px rgba(11,37,48,0.16); border-radius:12px; opacity:.97;}
  .drag-handle{
    cursor:grab; touch-action:none; user-select:none; -webkit-user-select:none;
    font-size:19px; line-height:1; color:var(--ink-soft); background:none; border:none;
    padding:4px 6px; flex-shrink:0;
  }
  .drag-handle:active{cursor:grabbing;}
  .item-row-main{display:flex; align-items:center; gap:10px;}
  .item-row-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px;}
  .label-edit{
    flex:1; min-width:0; width:auto; text-align:left; padding:10px 12px;
    border:2px solid #E4ECEE; border-radius:10px;
    font-family:'Nunito'; font-weight:700; font-size:14px;
  }
  .inline-check{
    display:flex; align-items:center; gap:5px; white-space:nowrap; flex-shrink:0;
    font-weight:700; font-size:12.5px; color:var(--ink-soft);
  }

  .icon-swatch{
    width:44px; height:44px; flex-shrink:0; border-radius:12px; border:none;
    background:var(--bg); font-size:22px; display:flex; align-items:center; justify-content:center;
  }
  .icon-swatch:active{transform:scale(.92);}
  .icon-grid{
    display:grid; grid-template-columns:repeat(6, 1fr); gap:8px; margin:6px 0 4px;
    max-height:50vh; overflow-y:auto;
  }
  .icon-grid button{
    aspect-ratio:1; border-radius:12px; border:2px solid transparent; background:var(--bg);
    font-size:22px; display:flex; align-items:center; justify-content:center;
  }
  .icon-grid button:active{transform:scale(.92); border-color:var(--teal-light);}

  .manual-grid{display:flex; flex-direction:column; gap:14px; margin-top:2px;}
  .manual-tile{
    border:none; border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);
    padding:20px 18px; min-height:96px;
    display:flex; align-items:center; gap:16px; text-align:left;
    transition: transform 120ms ease;
  }
  .manual-tile:active{transform:scale(.97);}
  .manual-tile-ic{font-size:38px; line-height:1; flex-shrink:0;}
  .manual-tile-text{flex:1;}
  .manual-tile-lbl{font-weight:800; font-size:17px; color:var(--ink);}
  .manual-tile-sub{font-weight:700; font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .manual-tile-chev{font-size:24px; font-weight:800; color:var(--ink-soft); flex-shrink:0;}
  .manual-tile.mt-chore{background:linear-gradient(135deg, #E3F7F4 0%, #C9EFE8 100%);}
  .manual-tile.mt-prize{background:linear-gradient(135deg, #FFE3DC 0%, #FFD2C4 100%);}

  .schedule-pill{
    background:var(--bg); border:none; border-radius:20px; padding:8px 14px;
    font-weight:800; font-size:12.5px; color:var(--navy); white-space:nowrap; flex-shrink:0;
  }
  .schedule-pill:active{transform:scale(.96);}
  .sched-type-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .sched-type-btn{
    flex:1 1 auto; padding:10px 12px; border-radius:14px; border:none;
    background:var(--bg); font-weight:800; font-size:12.5px; color:var(--ink-soft);
  }
  .sched-type-btn.active{background:var(--navy); color:#fff;}
  .sched-day-row{display:flex; gap:6px; margin:10px 0;}
  .sched-day-btn{
    flex:1; aspect-ratio:1; border-radius:10px; border:none; background:var(--bg);
    font-weight:800; font-size:12px; color:var(--ink-soft);
  }
  .sched-day-btn.active{background:var(--teal); color:#fff;}
  .sched-sub-label{font-weight:800; font-size:13px; color:var(--ink-soft); margin:14px 0 4px;}

  /* ---------- BOOT / LOGIN / OFFLINE ---------- */
  .boot-screen{
    position:fixed; inset:0; z-index:1000;
    background: linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .boot-logo{width:min(300px, 78vw); height:auto; margin-bottom:16px;}
  .boot-sub{font-size:14px; font-weight:700; opacity:.75; margin-top:6px; margin-bottom:22px;}
  .login-form{width:100%; max-width:320px;}
  .login-form input{background:rgba(255,255,255,.95);}
  .login-error{color:#FFD2CB; font-size:13px; font-weight:700; margin-top:10px; min-height:18px;}

  .lock-screen{display:none;}
  .lock-screen.show{display:flex;}
  .lock-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:16px; width:100%; max-width:420px; margin-top:28px;}
  .lock-tile{
    background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.18); border-radius:var(--radius-lg);
    padding:24px 12px; display:flex; flex-direction:column; align-items:center; gap:10px; color:#fff;
  }
  .lock-tile:active{transform:scale(.96); background:rgba(255,255,255,.16);}
  .lock-tile-avatar{font-size:48px; line-height:1;}
  .lock-tile-name{font-weight:800; font-size:15px;}
  .lock-tile-parent{grid-column:1 / -1; background:rgba(255,255,255,.04); border-style:dashed;}

  .offline-banner{
    position:fixed; top:0; left:0; right:0; z-index:500;
    background:var(--danger); color:#fff; text-align:center;
    font-weight:800; font-size:13px; padding:10px 16px;
    padding-top:calc(10px + env(safe-area-inset-top));
    transform:translateY(-100%); transition:transform 200ms ease;
  }
  .offline-banner.show{transform:translateY(0);}
  .content.offline-locked{pointer-events:none; opacity:.55;}

  /* ---------- TABLET (portrait ~800px, landscape ~1280px on a 10.1in 1280x800 device) ---------- */
  @media (min-width:700px){
    #app, .navbar, .sheet{ max-width:700px; }
  }
  @media (min-width:1000px){
    #app, .navbar, .sheet{ max-width:940px; }
    .grid{ grid-template-columns:repeat(3, 1fr); }
    .prize-list{ display:grid; grid-template-columns:repeat(2, 1fr); }
  }
</style>
</head>
<body>
<div class="offline-banner" id="offlineBanner">📡 Offline — changes are paused until reconnected</div>

<div id="app">

  <div class="header">
    <div class="header-top">
      <div>
        <div class="greeting display" id="greetingName">Hey there! 👋</div>
        <div class="greeting-sub" id="dateLine">Loading...</div>
      </div>
      <div class="lock-wrap">
        <button class="lock-btn" id="lockBtn">🔒</button>
        <div class="badge-count" id="pendingBadge" style="display:none;">0</div>
      </div>
    </div>
    <div class="child-switch-row" id="childSwitchRow"></div>
    <div class="meters">
      <div class="meter-card" id="pointsMeter">
        <div class="meter-label">Points</div>
        <div class="meter-value"><img class="point-core-icon" src="pip-point-core.png" alt=""><span id="pointsVal">0</span></div>
        <img class="points-pip" src="pip-treasure.png" alt="">
      </div>
      <div class="meter-card" id="minutesMeter">
        <div class="meter-label">Screen Time</div>
        <div class="meter-value"><span id="minutesVal">0</span><small>min</small></div>
        <img class="minutes-pip" src="pip-tv.png" alt="">
      </div>
    </div>
  </div>

  <div class="content" id="mainContent"></div>

  <div class="navbar">
    <button class="nav-btn active" data-view="home"><img class="ic" src="nav-home.png" alt="">Home</button>
    <button class="nav-btn" data-view="prizes"><img class="ic" src="nav-prizes.png" alt="">Prizes</button>
    <button class="nav-btn" data-view="history"><img class="ic" src="nav-history.png" alt="">History</button>
  </div>

</div>

<div class="floaters" id="floaters"></div>
<div class="toast" id="toast"></div>

<div class="undo-toast" id="undoToast">
  <span class="undo-toast-msg" id="undoToastMsg"></span>
  <button class="undo-toast-btn" id="undoToastBtn">Undo</button>
  <div class="undo-toast-bar-track"><div class="undo-toast-bar-fill" id="undoToastBarFill"></div></div>
</div>

<!-- PIN OVERLAY -->
<div class="overlay" id="pinOverlay">
  <div class="sheet" style="text-align:center;">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="pinTitle">Parent PIN</div>
    <div class="sheet-sub" id="pinSub">Enter the 4-digit code</div>
    <div class="pin-dots" id="pinDots"></div>
    <div class="pin-pad" id="pinPad"></div>
    <button class="btn btn-ghost" id="pinCancel">Cancel</button>
  </div>
</div>

<!-- PARENT OVERLAY -->
<div class="overlay" id="parentOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Parent Zone</div>
    <div class="tab-row tab-row-scroll">
      <button class="tab-btn active" data-ptab="approve">Approvals</button>
      <button class="tab-btn" data-ptab="chores">Activities</button>
      <button class="tab-btn" data-ptab="prizes">Prizes</button>
      <button class="tab-btn" data-ptab="challenges">Challenges</button>
      <button class="tab-btn" data-ptab="punishments">Punishments</button>
      <button class="tab-btn" data-ptab="settings">Settings</button>
    </div>
    <div id="parentBody"></div>
    <button class="btn btn-ghost" id="parentClose">Close</button>
  </div>
</div>

<!-- DAY DETAIL OVERLAY -->
<div class="overlay" id="dayOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="dayTitle">Day</div>
    <div id="dayBody"></div>
    <button class="btn btn-ghost" id="dayClose">Close</button>
  </div>
</div>

<!-- ICON PICKER OVERLAY -->
<div class="overlay" id="iconOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title" id="iconPickerTitle">Pick an Icon</div>
    <div id="iconPickerBody"></div>
    <button class="btn btn-ghost" id="iconClose">Close</button>
  </div>
</div>

<!-- SCHEDULE PICKER OVERLAY -->
<div class="overlay" id="scheduleOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Activity Schedule</div>
    <div id="schedulePickerBody"></div>
    <button class="btn btn-primary" id="scheduleSaveBtn" style="margin-top:14px;">Save Schedule</button>
    <button class="btn btn-ghost" id="scheduleClose">Close</button>
  </div>
</div>

<!-- CHALLENGE PICKER OVERLAY -->
<div class="overlay" id="challengeOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Challenge</div>
    <div id="challengePickerBody"></div>
    <button class="btn btn-primary" id="challengeSaveBtn" style="margin-top:14px;">Save Challenge</button>
    <button class="btn btn-ghost" id="challengeClose">Close</button>
  </div>
</div>

<!-- PUNISHMENT PICKER OVERLAY -->
<div class="overlay" id="punishmentOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Punishment</div>
    <div id="punishmentPickerBody"></div>
    <button class="btn btn-primary" id="punishmentSaveBtn" style="margin-top:14px;">Save Punishment</button>
    <button class="btn btn-ghost" id="punishmentClose">Close</button>
  </div>
</div>

<!-- PRIZE LIMIT PICKER OVERLAY -->
<div class="overlay" id="limitOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Redemption Limit</div>
    <div id="limitPickerBody"></div>
    <button class="btn btn-primary" id="limitSaveBtn" style="margin-top:14px;">Save Limit</button>
    <button class="btn btn-ghost" id="limitClose">Close</button>
  </div>
</div>

<!-- PIP NOTIFICATION OVERLAY -->
<div class="overlay" id="pipNotifyOverlay">
  <div class="sheet" style="text-align:center;">
    <div class="sheet-handle"></div>
    <img class="pip-notify-img" id="pipNotifyImg" src="" alt="Pip">
    <div class="pip-notify-title" id="pipNotifyTitle"></div>
    <div class="pip-notify-body" id="pipNotifyBody"></div>
    <button class="btn btn-primary" id="pipNotifyDismiss" style="margin-top:18px; width:100%;">Yay!</button>
  </div>
</div>

<!-- BOOT LOADING SCREEN -->
<div class="boot-screen" id="loadingScreen">
  <img class="boot-logo" src="logo-horizontal.png" alt="PointPal">
  <div class="boot-sub" id="loadingSub">Loading…</div>
</div>

<!-- LOGIN SCREEN -->
<div class="boot-screen" id="loginScreen" style="display:none;">
  <img class="boot-logo" src="logo-horizontal.png" alt="PointPal">
  <div class="boot-sub">Sign in to sync this device</div>
  <div class="login-form">
    <input type="email" id="loginEmail" class="child-name-input" placeholder="Family email" autocomplete="username">
    <input type="password" id="loginPassword" class="child-name-input" placeholder="Password" autocomplete="current-password" style="margin-top:10px;">
    <div class="login-error" id="loginError"></div>
    <button class="btn btn-primary" id="loginBtn" style="margin-top:14px;">Sign In</button>
  </div>
</div>

<!-- KIOSK IDLE LOCK SCREEN -->
<div class="boot-screen lock-screen" id="kioskLockScreen">
  <img class="boot-logo" src="logo-horizontal.png" alt="PointPal">
  <div class="boot-sub">Tap your avatar to continue</div>
  <div class="lock-grid" id="lockGrid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
